app:
    title: hister
    subtitle: zjv's own search engine
    color_scheme: automatic
    search_url: https://google.com/search?q={query}
    access_token: ""
    user_handling: false
    public: false
    log_level: info
    log_file: ""
    log_format: ""
    debug_sql: false
    open_results_on_new_tab: true
    redirect_on_no_results: true
    display_extractor_config: false
    disable_previews: false
    profiler: false
server:
    address: 127.0.0.1:4433
    base_url: ""
    database: db.sqlite3
    max_batch_body_size: 40
    oauth: {}
    oauth_only: false
indexer:
    detect_languages: true
    keep_stopwords: false
    max_file_size_mb: 1
    directories:
    - path: '/Users/zach/Documents/zv/notes/domains'
      filetypes: ['md']
    # - path: '~/Documents/wiki'
    #   label: 'wiki'
    # - path: '/path/to/project'
    #   label: 'project'
    #   filetypes: ['go', 'py', 'js']

    semantic_weight: 0.4
    max_embedding_concurrency: 2
hotkeys:
    web:
        /: focus_search_input
        '?': show_hotkeys
        alt+d: delete_result
        alt+enter: open_result_in_new_tab
        alt+j: select_next_result
        alt+k: select_previous_result
        alt+o: open_query_in_search_engine
        alt+v: view_result_popup
        enter: open_result
        tab: autocomplete
sensitive_content_patterns:
    aws_access_key: (^|[\s"'])AKIA[0-9A-Z]{16}([\s"']|$)
    aws_secret_key: (?i)aws(.{0,20})?(secret)?(.{0,20})?['"][0-9a-zA-Z\/+]{40}['"]
    generic_private_key: '-----BEGIN ((RSA|EC|DSA) )?PRIVATE KEY-----'
    github_token: (ghp|gho|ghu|ghs|ghr)_[a-zA-Z0-9]{36}
    pgp_private_key: '-----BEGIN PGP PRIVATE KEY BLOCK-----'
    ssh_private_key: '-----BEGIN OPENSSH PRIVATE KEY-----'
extractors: {}
